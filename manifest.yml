modules:
  jira:adminPage:
    - key: ivanti-migration-assistant-admin
      resource: main
      resolver:
        function: resolver
      title: Ivanti Migration Assistant

  trigger:
    - key: ivanti-orchestration-issue-events
      function: orchestration-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue

  webtrigger:
    - key: ivanti-prod-migration-trigger
      function: prod-migration-trigger
    - key: new-employee-demo-trigger
      function: new-employee-demo
    - key: vector-access-release-trigger
      function: vector-access-release
    - key: ivanti-offerings-release-trigger
      function: ivanti-offerings

  function:
    - key: resolver
      handler: combined.handler
    - key: orchestration-event
      handler: orchestrationGraphEngine.handleGraphIssueEvent
    - key: prod-migration-trigger
      handler: productionMigrationWebtrigger.handler
    - key: new-employee-demo
      handler: newEmployeeDemoWebtrigger.handler
    - key: vector-access-release
      handler: vectorAccessWebtrigger.handler
    - key: ivanti-offerings
      handler: ivantiOfferingsWebtrigger.handler

resources:
  - key: main
    path: static/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-configuration
    - manage:jira-project
    - read:servicedesk-request
    - read:requesttype:jira-service-management
    - write:requesttype:jira-service-management
    - storage:app
  external:
    fetch:
      backend:
        - address: '*.ivanticloud.com'
          inScopeEUD: true

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/fb771d13-f3c2-40b9-8f6b-ebd742fd4da1
