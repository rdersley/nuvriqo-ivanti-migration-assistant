name: Deploy Forge development

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-development
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ secrets.FORGE_SITE }}
      QA_JIRA_URL: ${{ secrets.QA_JIRA_URL }}
      QA_JIRA_STORAGE_STATE_B64: ${{ secrets.QA_JIRA_STORAGE_STATE_B64 }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Forms conditional visibility fix
        run: python .github/scripts/forms_condition_fix.py

      - name: Apply Forms runtime condition fix
        run: python .github/scripts/forms_condition_runtime_fix.py

      - name: Apply Forms canonical question id fix
        run: python .github/scripts/forms_condition_canonical_id_fix.py

      - name: Apply backend Forms controller repair
        run: python .github/scripts/forms_condition_backend_controller_fix.py

      - name: Apply persisted Forms section controller repair
        run: python .github/scripts/forms_persisted_section_controller_fix.py

      - name: Apply Ivanti lookup field fidelity fix
        run: python .github/scripts/lookup_field_fidelity_fix.py

      - name: Apply direct orchestration React view fix
        run: python .github/scripts/orchestration_react_view_fix.py

      - name: Apply Jira orchestration execution plan
        run: python .github/scripts/orchestration_execution_plan_fix.py

      - name: Apply orchestration-aware automation blueprint
        run: python .github/scripts/orchestration_automation_blueprint_fix.py

      - name: Apply orchestration-first safe UI
        run: python .github/scripts/orchestration_safe_ui_fix.py

      - name: Apply estate cutover readiness
        run: python .github/scripts/cutover_readiness_fix.py

      - name: Apply live Jira validation readback
        run: python .github/scripts/live_validation_readback_fix.py

      - name: Apply native Ivanti workflow XML import
        run: python .github/scripts/native_workflow_export_import_fix.py

      - name: Apply Ivanti direct discovery backend
        run: python .github/scripts/ivanti_direct_discovery_backend_fix.py

      - name: Apply Ivanti source acquisition
        run: python .github/scripts/ivanti_source_acquisition_fix.py

      - name: Hold unsupported action/wait/approval nodes for review
        run: python .github/scripts/action_review_hold_fix.py

      - name: Support multi-value Ivanti decision fields
        run: python .github/scripts/multivalue_decision_fix.py

      - name: Run migration regression QA
        run: python .github/scripts/qa_regression.py

      - name: Run orchestration runtime simulation QA
        run: python .github/scripts/qa_orchestration_runtime.py

      - name: Run cross-file source integrity QA
        run: python .github/scripts/qa_source_integrity.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install app dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix static install

      - name: Apply non-breaking frontend security fixes
        run: npm --prefix static audit fix

      - name: Enforce frontend dependency audit
        run: npm --prefix static audit --audit-level=high

      - name: Typecheck backend and frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Configure Forge CLI for CI
        run: |
          forge settings set usage-analytics true
          forge settings set default-environment development
          forge settings list

      - name: Enforce Forge lint
        run: forge lint

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE

      - name: Upgrade Jira installation
        run: forge install --upgrade --site "$FORGE_SITE" --product jira --environment development --confirm-scopes --non-interactive

      - name: Prepare authenticated Jira browser session
        if: ${{ env.QA_JIRA_STORAGE_STATE_B64 != '' && env.QA_JIRA_URL != '' }}
        run: |
          mkdir -p qa/browser
          printf '%s' "$QA_JIRA_STORAGE_STATE_B64" | base64 --decode > qa/browser/storage-state.json

      - name: Install Playwright browser QA runner
        if: ${{ env.QA_JIRA_STORAGE_STATE_B64 != '' && env.QA_JIRA_URL != '' }}
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run authenticated Jira browser QA
        if: ${{ env.QA_JIRA_STORAGE_STATE_B64 != '' && env.QA_JIRA_URL != '' }}
        env:
          QA_STORAGE_STATE_FILE: qa/browser/storage-state.json
          QA_PROJECT_KEY: DEMO
          QA_REQUEST_TYPE_ID: '60'
        run: npx playwright test --config qa/browser/playwright.config.mjs

      - name: Upload browser QA evidence
        if: ${{ always() && env.QA_JIRA_STORAGE_STATE_B64 != '' && env.QA_JIRA_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jira-browser-qa-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
