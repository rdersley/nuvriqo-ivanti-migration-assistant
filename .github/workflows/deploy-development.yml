name: Deploy Forge development

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-development
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ secrets.FORGE_SITE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Forms condition compatibility hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.ts')
          source = path.read_text()

          old_compare = """      // Atlassian Forms does not allow EQUAL_TO for ChoiceDropDown
      // questions. Choice-style questions use the set-membership checks
      // (SOME_OF / NONE_OF / ALL_OF), while scalar questions can use
      // EQUAL_TO. Resolve the controller's Forms question type before
      // choosing the comparison.
      const controllerField = fields.find(
        (field) => String(field.sourceId ?? '') === String(condition.controllerFieldId)
      );
      const controllerFormType = formQuestionType(controllerField?.jiraType);
      const comparisonType =
        controllerFormType === 'cd'
          ? 'SOME_OF'
          : 'EQUAL_TO';
"""
          new_compare = """      // Since March 2026 the Forms API supports EQUAL_TO in advanced
      // section conditions. Ivanti conditions carry the visible option value,
      // so use EQUAL_TO directly rather than treating that label as a choice ID.
      const comparisonType = 'EQUAL_TO';
"""
          if old_compare not in source:
              raise SystemExit('Expected comparison block not found; refusing an unsafe deployment.')
          source = source.replace(old_compare, new_compare, 1)

          old_legacy = """          // Atlassian Forms currently requires the legacy-compatible `co`
          // object even when the newer advanced operator/groups/checks
          // condition structure is supplied.
          co: {
            cIds: {}
          },
"""
          if old_legacy not in source:
              raise SystemExit('Expected legacy co block not found; refusing an unsafe deployment.')
          source = source.replace(old_legacy, '', 1)

          old_message = "Applied ${Object.keys(advancedConditions).length}/${conditions.length} inferred Ivanti conditional rule(s) using question-type-aware Forms checks (choice fields use SOME_OF; scalar fields use EQUAL_TO)."
          new_message = "Applied ${Object.keys(advancedConditions).length}/${conditions.length} inferred Ivanti conditional rule(s) using the current Forms advanced EQUAL_TO condition schema."
          source = source.replace(old_message, new_message, 1)
          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install app dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix static ci

      - name: Build frontend
        run: npm run build

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Configure Forge CLI for CI
        run: forge settings set usage-analytics false

      - name: Forge lint
        run: forge lint --environment development

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE

      - name: Upgrade Jira installation
        run: forge install --upgrade --site "$FORGE_SITE" --product jira --environment development --confirm-scopes --non-interactive
