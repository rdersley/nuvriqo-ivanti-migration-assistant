name: Deploy Forge development

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-development
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ secrets.FORGE_SITE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Forms condition compatibility hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.ts')
          source = path.read_text()

          start = source.index('      // Atlassian Forms does not allow EQUAL_TO for ChoiceDropDown')
          end_marker = "          : 'EQUAL_TO';\n"
          end = source.index(end_marker, start) + len(end_marker)
          replacement = '''      // Model Ivanti visibility rules as HIDE-when-not-matched conditions.\n      // Forms section conditions only execute the configured output when the\n      // check is true; using SHOW for the positive case leaves the section\n      // visible when the condition is false. Inverting the check gives the\n      // expected portal behaviour: hidden initially / hidden on non-match,\n      // visible only when the Ivanti source condition is satisfied.\n      const controllerField = fields.find(\n        (field) => String(field.sourceId ?? '') === String(condition.controllerFieldId)\n      );\n      const controllerFormType = formQuestionType(controllerField?.jiraType);\n      let comparisonType = 'DOES_NOT_EQUAL';\n      let comparisonConstraint = [String(condition.value ?? '')];\n\n      if (controllerFormType === 'cd') {\n        const controllerResolved = resolved.find((item) =>\n          normaliseStatusName(item.name) === normaliseStatusName(controllerField?.name)\n        );\n        const jiraFieldId = String(controllerResolved?.jiraFieldId ?? '');\n        if (!jiraFieldId) {\n          unresolvedRules.push({\n            id: String((condition as any).id ?? conditionIndex + 1),\n            reason: 'Controller Jira choice field was not resolved.'\n          });\n          continue;\n        }\n\n        try {\n          const contextId = await getFirstContextId(jiraFieldId);\n          const optionResponse = await api.asUser().requestJira(\n            route`/rest/api/3/field/${jiraFieldId}/context/${contextId}/option?maxResults=100`,\n            { headers: { Accept: 'application/json' } }\n          );\n          const optionBody = await parseResponse<{ values?: Array<{ id?: string; value?: string }> }>(optionResponse);\n          const wanted = normaliseStatusName(condition.value);\n          const option = (optionBody.values ?? []).find((item) =>\n            normaliseStatusName(item.value) === wanted\n          );\n          if (!option?.id) {\n            unresolvedRules.push({\n              id: String((condition as any).id ?? conditionIndex + 1),\n              reason: `No Jira option ID matched condition value ${String(condition.value ?? '')}.`\n            });\n            continue;\n          }\n          comparisonType = 'NONE_OF';\n          comparisonConstraint = [String(option.id)];\n        } catch (error) {\n          unresolvedRules.push({\n            id: String((condition as any).id ?? conditionIndex + 1),\n            reason: `Could not resolve Jira option ID: ${String((error as Error)?.message ?? error)}`\n          });\n          continue;\n        }\n      }\n'''
          source = source[:start] + replacement + source[end:]

          old_constraint = "constraint: [String(condition.value ?? '')]"
          if old_constraint not in source:
              raise SystemExit('Condition constraint expression not found')
          source = source.replace(old_constraint, 'constraint: comparisonConstraint', 1)

          # Preserve the compatibility object used by the current Forms save path.
          # It is harmless alongside advanced groups/checks and avoids regressing
          # tenants that still expect it.

          # Change section output from positive SHOW to inverse HIDE. This is the
          # behavioural correction: a failed positive show check does not itself
          # hide an otherwise visible section.
          output_marker = "t: 'sh'"
          if output_marker not in source:
              raise SystemExit('Forms condition output marker not found')
          source = source.replace(output_marker, "t: 'hide'", 1)

          # Retain explicit opt-in for compatibility with sites still gating
          # advanced Forms condition saves.
          needle = "body: JSON.stringify({ design: conditionedDesign })"
          put_at = source.index(needle)
          header_start = source.rfind("headers: { Accept: 'application/json', 'Content-Type': 'application/json' },", 0, put_at)
          if header_start >= 0:
              old_header = "headers: { Accept: 'application/json', 'Content-Type': 'application/json' },"
              new_header = "headers: { Accept: 'application/json', 'Content-Type': 'application/json', 'X-ExperimentalApi': 'opt-in' },"
              source = source[:header_start] + source[header_start:].replace(old_header, new_header, 1)

          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install app dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix static ci

      - name: Build frontend
        run: npm run build

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Configure Forge CLI for CI
        run: forge settings set usage-analytics false

      - name: Forge lint
        run: forge lint --environment development

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE

      - name: Upgrade Jira installation
        run: forge install --upgrade --site "$FORGE_SITE" --product jira --environment development --confirm-scopes --non-interactive
