name: Deploy Forge development

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-development
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ secrets.FORGE_SITE }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Forms conditional visibility fix
        run: python .github/scripts/forms_condition_fix.py

      - name: Apply Forms runtime condition fix
        run: python .github/scripts/forms_condition_runtime_fix.py

      - name: Apply Forms canonical question id fix
        run: python .github/scripts/forms_condition_canonical_id_fix.py

      - name: Apply backend Forms controller repair
        run: python .github/scripts/forms_condition_backend_controller_fix.py

      - name: Apply persisted Forms section controller repair
        run: python .github/scripts/forms_persisted_section_controller_fix.py

      - name: Apply direct orchestration React view fix
        run: python .github/scripts/orchestration_react_view_fix.py

      - name: Apply Jira orchestration execution plan
        run: python .github/scripts/orchestration_execution_plan_fix.py

      - name: Apply orchestration-aware automation blueprint
        run: python .github/scripts/orchestration_automation_blueprint_fix.py

      - name: Run migration regression QA
        run: python .github/scripts/qa_regression.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install app dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix static ci

      - name: Typecheck backend and frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Configure Forge CLI for CI
        run: |
          forge settings set usage-analytics true
          forge settings list

      - name: Forge lint
        run: forge lint --environment development

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE

      - name: Upgrade Jira installation
        run: forge install --upgrade --site "$FORGE_SITE" --product jira --environment development --confirm-scopes --non-interactive
