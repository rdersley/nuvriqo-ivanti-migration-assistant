name: Deploy Forge development

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-development
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ secrets.FORGE_SITE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Forms condition compatibility hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.ts')
          source = path.read_text()
          start = source.index('      // Atlassian Forms does not allow EQUAL_TO for ChoiceDropDown')
          end_marker = "          : 'EQUAL_TO';\n"
          end = source.index(end_marker, start) + len(end_marker)
          replacement = "      // Current Forms API supports EQUAL_TO in advanced section conditions.\n      const comparisonType = 'EQUAL_TO';\n"
          source = source[:start] + replacement + source[end:]
          legacy_start = source.index('          // Atlassian Forms currently requires the legacy-compatible `co`')
          legacy_end_marker = '          },\n          operator:'
          legacy_end = source.index(legacy_end_marker, legacy_start)
          source = source[:legacy_start] + '          operator:' + source[legacy_end + len(legacy_end_marker):]
          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install app dependencies
        run: npm install

      - name: Install frontend dependencies
        run: npm --prefix static ci

      - name: Build frontend
        run: npm run build

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Configure Forge CLI for CI
        run: forge settings set usage-analytics false

      - name: Forge lint
        run: forge lint --environment development

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE

      - name: Upgrade Jira installation
        run: forge install --upgrade --site "$FORGE_SITE" --product jira --environment development --confirm-scopes --non-interactive
