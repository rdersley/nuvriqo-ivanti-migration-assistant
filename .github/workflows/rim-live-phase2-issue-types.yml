name: Retail in Motion Live Migration - Phase 2 Issue Types

on:
  push:
    branches:
      - production-migration-runner
    paths:
      - '.github/scripts/rim_phase2_issue_types.py'
      - '.github/workflows/rim-live-phase2-issue-types.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rim-live-migration-phase2-issue-types
  cancel-in-progress: false

jobs:
  issue-types:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      RIM_FORGE_SITE: ${{ secrets.RIM_FORGE_SITE }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse ROX sources
        run: python .github/scripts/production_migration_dry_run.py
      - name: Build Jira creation plan
        run: python .github/scripts/build_creation_plan.py
      - name: Clean known migration duplicates and create issue types
        run: python .github/scripts/rim_phase2_issue_types.py
      - name: Upload phase-two result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retailinmotion-live-phase2-issue-types
          path: migration-output/live-create-phase2/
          if-no-files-found: warn
          retention-days: 14
